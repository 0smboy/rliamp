[package]
name = "rliamp"
version = "0.1.13"
edition = "2021"

[features]
default = []
spotify-experimental = [
    "dep:librespot-core",
    "dep:librespot-oauth",
    "dep:librespot-playback",
    "dep:tokio",
]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
cpal = "0.13.5"
coreaudio-sys = "=0.2.12"
crossterm = "0.25.0"
glob = "0.3"
librespot-core = { version = "0.8", default-features = false, features = ["native-tls"], optional = true }
librespot-oauth = { version = "0.8", default-features = false, features = ["native-tls"], optional = true }
librespot-playback = { version = "0.8", default-features = false, features = ["native-tls"], optional = true }
libloading = "=0.8.0"
lock_api = "=0.4.11"
parking_lot = "=0.12.1"
parking_lot_core = "=0.9.9"
proc-macro2 = "=1.0.106"
quote = "=1.0.41"
rand = "0.8"
rustfft = "6.1"
quick-xml = "0.38"
ureq = "2.10"
md5 = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
urlencoding = "2.1"
syn = "=2.0.117"
symphonia = { version = "0.5.2", features = ["mp3", "aac", "isomp4", "alac", "flac", "ogg", "vorbis", "wav"] }
unicode-ident = "=1.0.12"
unicode-width = "0.1"
encoding_rs = "0.8"

[patch.crates-io]
librespot-core = { path = "vendor/librespot-core-0.8.0" }
